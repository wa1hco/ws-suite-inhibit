# ws-hunter for Windows (x64), built with MSYS2 (UCRT64, MinGW-w64 gcc) and Qt 5: a zip
# with ws.exe and everything it needs. A tag v* also makes a GitHub release.
# Hamlib comes from the official WS superbuild tarball (patched, static),
# as in build-hunter.sh.
name: windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPER_URL: https://sourceforge.net/projects/wsjt-x-improved/files/WS_v3.2.0/Source%20code/ws-3.2.0_260924.tgz/download
  SUPER_MD5: 93069373277c7976eebbc4ec644bf79b
  HAMLIB: hamlib-4.7.3
  OMNIRIG_URL: https://www.dxatlas.com/OmniRig/Files/OmniRig.zip
  OMNIRIG_MD5: 6a43e3921b7c846b70a25c2f1b2668fd

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch tar curl zip autoconf automake libtool
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base mingw-w64-ucrt-x86_64-qt5-multimedia mingw-w64-ucrt-x86_64-qt5-serialport
            mingw-w64-ucrt-x86_64-qt5-tools mingw-w64-ucrt-x86_64-qt5-websockets mingw-w64-ucrt-x86_64-qt5-activeqt
            mingw-w64-ucrt-x86_64-fftw mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-libusb mingw-w64-ucrt-x86_64-portaudio

      - name: Superbuild tarball (cached)
        id: super
        uses: actions/cache@v4
        with:
          path: superbuild.tgz
          key: superbuild-${{ env.SUPER_MD5 }}
      - name: Download superbuild tarball
        if: steps.super.outputs.cache-hit != 'true'
        run: curl -fL --retry 5 -o superbuild.tgz "$SUPER_URL"
      - name: Check it
        run: echo "$SUPER_MD5  superbuild.tgz" | md5sum -c

      - name: Hamlib build (cached)
        id: hamlib
        uses: actions/cache@v4
        with:
          path: hamlib
          key: hamlib-${{ env.SUPER_MD5 }}-ucrt64-gcc15-1  # bump when the Hamlib step changes
      - name: Hamlib (static, WS's patch)
        if: steps.hamlib.outputs.cache-hit != 'true'
        run: |
          mkdir superbuild
          tar xzf superbuild.tgz -C superbuild --strip-components=1 \
              "ws-3.2.0/src/$HAMLIB.tar.gz" ws-3.2.0/hamlib.patch
          tar xzf "superbuild/src/$HAMLIB.tar.gz"
          cd "$HAMLIB"
          patch -p1 -N < ../superbuild/hamlib.patch
          ./configure --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/hamlib" --disable-shared --enable-static \
              --without-cxx-binding --disable-winradio \
              "CFLAGS=-O2 -fdata-sections -ffunction-sections -std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          make -j4
          make install-strip
      - name: Keep the Hamlib build (even if a later step fails)
        if: steps.hamlib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hamlib
          key: ${{ steps.hamlib.outputs.cache-primary-key }}

      - name: OmniRig (WS on Windows generates its rig interface from OmniRig's type library)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:OMNIRIG_URL -OutFile OmniRig.zip
          if ((Get-FileHash OmniRig.zip -Algorithm MD5).Hash -ne $env:OMNIRIG_MD5) { throw "OmniRig.zip: MD5 mismatch" }
          Expand-Archive OmniRig.zip -DestinationPath omnirig
          Start-Process omnirig/OmniRigSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $exe = Get-ChildItem "${env:ProgramFiles(x86)}","$env:ProgramFiles" -Recurse -Filter OmniRig.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "OmniRig.exe not found after install" }
          "OmniRig: $($exe.FullName)"
          "OMNIRIG_EXE=$($exe.FullName -replace '\\','/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure
        run: |
          # MSYS2 names Qt 5's dumpcpp dumpcpp-qt5.exe
          dumpcpp=$(ls /ucrt64/bin/dumpcpp-qt5.exe /ucrt64/bin/dumpcpp.exe 2>/dev/null | head -1)
          [ -n "$dumpcpp" ] || { echo "no dumpcpp in /ucrt64/bin"; exit 1; }
          echo "dumpcpp: $dumpcpp"
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$GITHUB_WORKSPACE/hamlib")" \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$GITHUB_WORKSPACE/dist/ws-hunter")" \
            -DWSJT_GENERATE_DOCS=OFF -DWSJT_SKIP_MANPAGES=ON -DWSJT_BUILD_UTILS=OFF \
            -DOMNIRIG_EXE="$OMNIRIG_EXE" \
            -DDUMPCPP="$(cygpath -m "$dumpcpp")" -DDUMPCPP_Executable="$(cygpath -m "$dumpcpp")"
      - name: Build
        run: cmake --build build -j4
      - name: "Install, with WS's bundle fixup (Qt plugins and DLLs)"
        run: cmake --install build

      - name: Any DLL still missing, from UCRT64
        run: |
          cd dist/ws-hunter/bin
          for i in 1 2 3; do  # DLLs can pull in more DLLs
            for f in *.exe *.dll; do ldd "$f" 2>/dev/null; done | awk '/\/ucrt64\/bin\//{print $3}' | sort -u |
              while read -r d; do [ -f "$(basename "$d")" ] || cp -v "$d" .; done
          done
          ls

      - name: Smoke test (starts, reports its version)
        shell: pwsh
        run: |
          $p = Start-Process dist/ws-hunter/bin/ws.exe -ArgumentList "--version" -PassThru -NoNewWindow
          Start-Sleep 10
          if (-not $p.HasExited) { "ws.exe still running after 10 s (fine: no --version on Windows)"; Stop-Process $p }
          else { "exit code $($p.ExitCode)" ; if ($p.ExitCode -lt 0 -or $p.ExitCode -gt 1) { exit 1 } }

      - name: Zip
        run: |
          cp README dist/ws-hunter/README-ws-hunter.txt
          cd dist && zip -qr ../ws-hunter-windows-x64.zip ws-hunter
      - uses: actions/upload-artifact@v4
        with:
          name: ws-hunter-windows-x64
          path: ws-hunter-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ws-hunter-windows-x64.zip -R "$GITHUB_REPOSITORY" \
            --title "ws-hunter $GITHUB_REF_NAME (Windows)" --generate-notes
